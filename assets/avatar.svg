<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>rackrot</title>
  <rect width="512" height="512" fill="#15171c"/>
  <!-- rack frame -->
  <rect x="116" y="76" width="280" height="340" rx="18" fill="#22262e" stroke="#3a404b" stroke-width="10"/>
  <!-- rack ears / rails -->
  <rect x="136" y="96" width="14" height="300" rx="4" fill="#2d323b"/>
  <rect x="362" y="96" width="14" height="300" rx="4" fill="#2d323b"/>
  <!-- units -->
  <g fill="#323844" stroke="#454c59" stroke-width="4">
    <rect x="160" y="106" width="192" height="68" rx="8"/>
    <rect x="160" y="190" width="192" height="68" rx="8"/>
    <rect x="160" y="274" width="192" height="68" rx="8"/>
  </g>
  <!-- vents -->
  <g stroke="#1b1e24" stroke-width="6" stroke-linecap="round">
    <path d="M232 128v24M252 128v24M272 128v24M292 128v24M312 128v24"/>
    <path d="M232 212v24M252 212v24M272 212v24M292 212v24M312 212v24"/>
    <path d="M232 296v24M252 296v24M272 296v24"/>
  </g>
  <!-- status LEDs -->
  <circle cx="190" cy="140" r="10" fill="#4ade80"/>
  <circle cx="190" cy="224" r="10" fill="#4ade80"/>
  <circle cx="190" cy="308" r="10" fill="#ef4444"/>
  <!-- rot: slime oozing from the bottom unit and dripping off the rack -->
  <path fill="#9be15d" d="M286 290c14-10 40-12 58-2 10 6 10 18 8 30v26c0 4-2 6-6 6h-6v60c0 12-18 12-18 0v-60h-12v28c0 10-14 10-14 0v-28h-14c-8 0-10-8-6-14 4-8 2-18 2-26 0-8 2-14 8-20z"/>
  <path fill="#9be15d" d="M392 330c8 0 12 6 12 14v64c0 14-20 14-20 0v-64c0-8 2-14 8-14z"/>
  <circle cx="331" cy="460" r="10" fill="#9be15d"/>
  <circle cx="394" cy="440" r="7" fill="#9be15d"/>
  <!-- slime highlights -->
  <path d="M298 300c10-6 24-8 36-4" fill="none" stroke="#c8f59a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="320" cy="320" r="5" fill="#6fb83a"/>
  <circle cx="306" cy="332" r="3.5" fill="#6fb83a"/>
</svg>
